name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start --exclude studio

      - name: Export local database URL
        shell: bash
        run: npx supabase status -o env | sed -n 's/^DB_URL=/DATABASE_URL=/p' >> "$GITHUB_ENV"

      - name: Reapply database migrations
        run: npx supabase db reset --local --no-seed

      - name: Lint private database schema
        run: npx supabase db lint --local --schema private --level error --fail-on error

      - name: Test database integration
        env:
          CREW_RUN_DB_TESTS: "1"
        run: npm test -- src/server/database.integration.test.ts

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: npx supabase start --exclude studio

      - name: Export local database URL
        shell: bash
        run: npx supabase status -o env | sed -n 's/^DB_URL=/DATABASE_URL=/p' >> "$GITHUB_ENV"

      - name: Reapply database migrations
        run: npx supabase db reset --local --no-seed

      - name: Run browser and accessibility tests
        env:
          ADMIN_PASSWORD: crew-e2e-admin-password
          ADMIN_SESSION_SECRET: crew-e2e-session-secret-that-is-at-least-32-characters
          CREW_RUN_DB_E2E: "1"
        run: npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
